name: Replace with larger caption version (one-time)
on:
  push:
    paths:
      - '.github/workflows/replace-subtitles-bigger-20261117.yml'
permissions:
  contents: write
jobs:
  replace-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify enlarged captions
        env:
          VIDEO_URL: "https://70ac2b99-b7ed-4aba-8e46-2ac804414a6d.sandbox.floot.app/_cdn/static/66e22ef1-1822-4576-be03-e9f87438f399-veydrix_subtitles_bigger_20261117.mp4"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$VIDEO_URL" --output "video/KakaoTalk_20261117_131448007_subtitles_large.mp4"
          echo "08d048f97f21f3c2d103331432b5e71d8ba49e2507832a3723e0887c297cb049  video/KakaoTalk_20261117_131448007_subtitles_large.mp4" | sha256sum -c -
      - name: Commit corrected video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "video/KakaoTalk_20261117_131448007_subtitles_large.mp4"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace subtitles with larger readable captions"
          git push
