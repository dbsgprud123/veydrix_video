name: Import CIGA CEO reels standalone (one-time)
on:
  push:
    paths:
      - '.github/workflows/import-ceo-reels-20261118.yml'
permissions:
  contents: write
jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify separate reels video
        env:
          VIDEO_URL: "https://70ac2b99-b7ed-4aba-8e46-2ac804414a6d.sandbox.floot.app/_cdn/static/98009518-fe77-44d4-83fe-c73415a9f53f-veydrix_ceo_reels_20261118.mp4"
        run: |
          set -euo pipefail
          mkdir -p video
          curl --fail --location --retry 3 --silent --show-error "$VIDEO_URL" --output "video/VEYDRIX_CIGA_Reels_9x16_CEO_CUTS_RESTORED.mp4"
          echo "d24e44454325a3dd28633037ca03ab3140b808cbaee8dc48983d89cf5e020d0f  video/VEYDRIX_CIGA_Reels_9x16_CEO_CUTS_RESTORED.mp4" | sha256sum -c -
      - name: Commit standalone reels video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "video/VEYDRIX_CIGA_Reels_9x16_CEO_CUTS_RESTORED.mp4"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add CIGA 9x16 CEO speech reels as separate file"
          git push
